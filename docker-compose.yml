# CodeRank Root Docker Compose
# Quickstart:
#   1. Copy .env.example to .env
#   2. Run `docker compose up -d` to start Redis & PostgreSQL (pre-seeded with initial dataset)
#   3. Run `npm run worker` and `npm run web` to start the app locally
services:
  redis:
    image: redis:7-alpine
    container_name: coderank-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: coderank-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coderank_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coderank_local"]
      interval: 5s
      timeout: 3s
      retries: 5

  runner-image:
    build:
      context: .
      dockerfile: infrastructure/docker/runner/Dockerfile
    image: coderank-base:latest
    profiles:
      - build-image

volumes:
  redis_data:
  postgres_data:
