x-daemon-config: &daemon-config
  build:
    context: .
    dockerfile: Dockerfile
  image: coderank-base:latest
  restart: unless-stopped
  network_mode: "none"
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /app:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1770
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770

services:
  redis:
    image: redis:alpine
    container_name: coderank-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  coderank-python-daemon:
    <<: *daemon-config
    container_name: coderank-python-daemon

  coderank-cpp-daemon:
    <<: *daemon-config
    container_name: coderank-cpp-daemon

  coderank-c-daemon:
    <<: *daemon-config
    container_name: coderank-c-daemon

  coderank-java-daemon:
    <<: *daemon-config
    container_name: coderank-java-daemon

  coderank-javascript-daemon:
    <<: *daemon-config
    container_name: coderank-javascript-daemon
