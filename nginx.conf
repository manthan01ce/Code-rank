user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Settings for Next.js assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting Zones (10 requests per second allowed for API)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream coderank_nextjs {
        # PM2 is running Next.js on port 3000
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _; # Change this to college domain (e.g., coderank.college.edu)

        # Proxy Next.js requests
        location / {
            proxy_pass http://coderank_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward real IPs for Rate Limiting in Next.js
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # Apply NGINX-level strict rate limiting for the submit endpoints
        location /api/submit {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://coderank_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        location /api/cpp-run {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://coderank_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
        
        location /api/python-run {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://coderank_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # Socket.IO WebSocket Support
        location /socket.io/ {
            proxy_pass http://coderank_nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
