# Authoritative local infrastructure. Redis binds only to loopback.
services:
  redis:
    image: redis:7-alpine
    container_name: coderank-redis
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: coderank-postgres
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coderank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coderank123}
      POSTGRES_DB: ${POSTGRES_DB:-coderank}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
    - local-database
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DATABASE_URL=${DATABASE_URL}
    - DATABASE_DRIVER=${DATABASE_DRIVER:-neon}
    - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
    - DB_QUERY_TIMEOUT_MS=${DB_QUERY_TIMEOUT_MS:-30000}
    - SANDBOX_SCOPE=${SANDBOX_SCOPE:-coderank}
    - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-8}
    - JOB_TIMEOUT_MS=${JOB_TIMEOUT_MS:-30000}
    - JWT_SECRET=${JWT_SECRET}
    - REALTIME_URL=${REALTIME_URL:-http://host.docker.internal:3000}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # Docker's default 10s stop timeout is shorter than one execution job.
    stop_grace_period: 150s
    profiles:
    - container-worker
    extra_hosts:
    - host.docker.internal:host-gateway
  # Optional container web tier has no Docker socket, runner package or CLI.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DATABASE_URL=${DATABASE_URL}
    - DATABASE_DRIVER=${DATABASE_DRIVER:-neon}
    - JWT_SECRET=${JWT_SECRET}
    - REALTIME_REDIS_ENABLED=true
    - CLUSTER_ENABLED=true
    - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
    - 127.0.0.1:3000:3000
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/web/.next/cache:uid=1000,gid=1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 150s
    restart: unless-stopped
    profiles:
    - container-web
  runner-image:
    build:
      context: ..
      dockerfile: infrastructure/docker/runner/Dockerfile
    image: coderank-base:latest
    profiles:
    - build-image

volumes:
  redis_data: null
  postgres_data: null
