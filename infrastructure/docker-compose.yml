# Authoritative local services. Existing named database/Redis volumes are preserved.
services:
  redis:
    image: redis:7-alpine
    container_name: coderank-redis
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: coderank-postgres
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coderank_local}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
    - local-database
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DATABASE_URL=${DATABASE_URL}
    - DATABASE_DRIVER=${DATABASE_DRIVER:-neon}
    - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
    - DB_QUERY_TIMEOUT_MS=${DB_QUERY_TIMEOUT_MS:-30000}
    - SANDBOX_SCOPE=${SANDBOX_SCOPE:-coderank}
    - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-8}
    - JOB_TIMEOUT_MS=${JOB_TIMEOUT_MS:-30000}
    - JWT_SECRET=${JWT_SECRET}
    - REALTIME_URL=${REALTIME_URL:-http://host.docker.internal:3001}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    stop_grace_period: 150s
    profiles:
    - container-worker
    extra_hosts:
    - host.docker.internal:host-gateway
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
    - PORT=3000
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/web/.next/cache:uid=1000,gid=1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 150s
    restart: unless-stopped
    profiles:
    - container-web
    expose:
    - '3000'
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
    - API_HOST=0.0.0.0
    - PORT=3001
    - API_PORT=3001
    - NODE_ENV=production
    - JWT_SECRET=${JWT_SECRET}
    - DATABASE_URL=${DATABASE_URL}
    - DATABASE_DRIVER=${DATABASE_DRIVER:-neon}
    - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
    - DB_QUERY_TIMEOUT_MS=${DB_QUERY_TIMEOUT_MS:-30000}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REALTIME_REDIS_ENABLED=true
    - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
    - 127.0.0.1:3001:3001
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    profiles:
    - container-api
  runner-image:
    build:
      context: ..
      dockerfile: infrastructure/docker/runner/Dockerfile
    image: coderank-base:latest
    profiles:
    - build-image
  gateway:
    build:
      context: ..
      dockerfile: infrastructure/gateway/Dockerfile
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    environment:
    - INTERNAL_WEB_URL=http://web:3000
    - INTERNAL_API_URL=http://api:3001
    - PORT=3000
    ports:
    - 127.0.0.1:3000:3000
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    profiles:
    - container-gateway
volumes:
  redis_data:
    name: ${CODERANK_REDIS_VOLUME:-infrastructure_redis_data}
  postgres_data:
    name: ${CODERANK_POSTGRES_VOLUME:-infrastructure_postgres_data}
