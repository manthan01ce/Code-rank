# Warm execution daemons overlay for local development and lab environments.
# Extends infrastructure/docker-compose.yml.
#
# Usage:
#   docker compose -f infrastructure/docker-compose.yml -f infrastructure/compose.warm-daemons.yaml up -d
#
# Note:
#   Warm daemons reuse long-running containers per language (coderank-<lang>-daemon)
#   for low latency under USE_WARM_DAEMONS=true. They DO NOT provide per-job filesystem
#   or process isolation; use disposable sandboxes for untrusted multi-tenant execution.

x-daemon-config: &daemon-config
  image: coderank-base:latest
  command: ["tail", "-f", "/dev/null"]
  restart: unless-stopped
  network_mode: "none"
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /app:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1770
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770

services:
  coderank-python-daemon:
    <<: *daemon-config
    container_name: coderank-python-daemon

  coderank-cpp-daemon:
    <<: *daemon-config
    container_name: coderank-cpp-daemon

  coderank-c-daemon:
    <<: *daemon-config
    container_name: coderank-c-daemon

  coderank-java-daemon:
    <<: *daemon-config
    container_name: coderank-java-daemon

  coderank-javascript-daemon:
    <<: *daemon-config
    container_name: coderank-javascript-daemon

