name: Architecture checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Budget mode: opt in on the final PR revision; skipped is not certification.
    if: contains(github.event.pull_request.labels.*.name, 'ci:full-stack')
    name: Full Stack & Strict Architecture Certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coderank_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-not-for-production
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coderank_test
      DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder
      NEXT_TELEMETRY_DISABLED: '1'
      PG_DUMP_BIN: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/16/bin/pg_restore
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint critical paths
        run: npm run lint:critical

      - name: Run unit tests
        run: npm test
        timeout-minutes: 5

      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 5

      - name: Build base execution container
        run: docker build -t coderank-base:latest -f infrastructure/docker/runner/Dockerfile .

      - name: Run Docker sandbox isolation tests
        run: npm run test:docker
        timeout-minutes: 5

      - name: Validate authoritative Compose configuration
        run: |
          docker compose -f infrastructure/docker-compose.yml config --quiet
          docker compose -f infrastructure/docker-compose.yml --profile local-database config --quiet
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/compose.warm-daemons.yaml --profile local-database config --quiet
          docker compose -f infrastructure/docker-compose.yml -f infrastructure/compose.containers.yaml --profile local-database config --quiet

      - name: Build worker deployment image
        run: docker build -t coderank-worker:ci -f apps/worker/Dockerfile .

      - name: Build API application bundle
        run: npm run build --workspace=@coderank/api

      - name: Build isolated API deployment image
        run: docker build -t coderank-api:ci -f apps/api/Dockerfile .

      - name: Verify isolated API image without web or infrastructure
        run: |
          api_container_id=$(docker run --rm -d --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:3301:3001 coderank-api:ci)
          trap 'docker rm -f "$api_container_id" >/dev/null 2>&1 || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let live;
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:3301/api/live', { signal: AbortSignal.timeout(1000) });
              if (response.status === 200) { live = await response.json(); break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          assert.equal(live?.status, 'ok', 'Isolated API container must serve liveness');
          NODE

      - name: Build web application bundle
        run: npm run build --workspace=apps/web

      - name: Build isolated web deployment image
        run: docker build -t coderank-web:ci -f apps/web/Dockerfile .

      - name: Verify independent artifacts and frontend without backend services or secrets
        run: |
          docker run --rm --entrypoint node coderank-web:ci -e "const fs=require('fs');for(const p of ['/app/packages/core','/app/packages/database','/app/packages/queue','/app/packages/runner'])if(fs.existsSync(p))throw Error(p);for(const p of ['pg','redis','bullmq','jsonwebtoken','@coderank/core']){try{require.resolve(p);throw Error('Forbidden backend module '+p)}catch(e){if(e.code!=='MODULE_NOT_FOUND')throw e}}"
          docker run --rm --entrypoint node coderank-api:ci -e "for(const p of ['next','react','@coderank/runner']){try{require.resolve(p);throw Error('Forbidden API module '+p)}catch(e){if(e.code!=='MODULE_NOT_FOUND')throw e}}"
          web_container_id=$(docker run --rm -d --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache:uid=1000,gid=1000 --cap-drop ALL -p 127.0.0.1:3300:3000 coderank-web:ci)
          trap 'docker rm -f "$web_container_id" >/dev/null 2>&1 || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let response;
          for (let attempt = 0; attempt < 60; attempt++) {
            try { response = await fetch('http://127.0.0.1:3300/login', { signal: AbortSignal.timeout(1000) }); if (response.status === 200) break; } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          assert.equal(response?.status, 200, 'Next.js must serve pages independently');
          assert.equal((await fetch('http://127.0.0.1:3300/api/live')).status, 404, 'web must not implement an API');
          NODE

      - name: Build infrastructure gateway image
        run: docker build -t coderank-gateway:ci -f infrastructure/gateway/Dockerfile .

      - name: Verify all application artifacts together through the public gateway
        run: node scripts/ci/container-topology.mjs
        timeout-minutes: 8

      - name: Full web-to-worker execution round trip
        run: npm run test:stack

      - name: Install real browser
        run: node scripts/ci/install-browser.mjs
        timeout-minutes: 14

      - name: Install matching database recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          "$PG_DUMP_BIN" --version
          "$PG_RESTORE_BIN" --version
        timeout-minutes: 5

      - name: Verify authenticated cluster, capacity and database/process recovery
        run: npm run test:authenticated
        timeout-minutes: 10

      - name: Certify this exact commit against complete strict CI evidence
        run: node scripts/ci/write-certification.mjs

      - name: Publish certification summary
        if: always()
        run: |
          echo "### 🛡️ Strict Architecture Certification" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/certification.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat test-results/certification.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Certification file not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Preserve strict test reports and stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-verification-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
