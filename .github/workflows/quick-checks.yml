name: Fast PR & Commit Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-preflight:
    name: Code Quality & Schema Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coderank_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      JWT_SECRET: ci-quick-check-secret
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coderank_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coderank_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint critical packages and services
        id: lint
        run: npm run lint:critical

      - name: Apply database migrations
        id: migrate
        run: npm run db:migrate

      - name: Database schema preflight validation
        id: preflight
        run: npm run db:preflight

      - name: Run strict unit test suite
        id: unit
        run: npm test
        timeout-minutes: 5

      - name: Generate summary report
        if: always()
        env:
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_MIGRATE: ${{ steps.migrate.outcome }}
          OUTCOME_PREFLIGHT: ${{ steps.preflight.outcome }}
          OUTCOME_UNIT: ${{ steps.unit.outcome }}
        run: node scripts/ci/generate-summary.mjs
