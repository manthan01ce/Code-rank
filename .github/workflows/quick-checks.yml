name: Fast PR & Commit Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-preflight:
    name: Code Quality & Schema Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coderank_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      JWT_SECRET: ci-quick-check-secret
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coderank_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coderank_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint critical packages and services
        id: lint
        run: npm run lint:critical

      - name: Apply database migrations
        id: migrate
        run: npm run db:migrate

      - name: Database schema preflight validation
        id: preflight
        run: npm run db:preflight

      - name: Run strict unit test suite
        id: unit
        run: npm test
        timeout-minutes: 5

      - name: Generate summary report
        if: always()
        env:
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_MIGRATE: ${{ steps.migrate.outcome }}
          OUTCOME_PREFLIGHT: ${{ steps.preflight.outcome }}
          OUTCOME_UNIT: ${{ steps.unit.outcome }}
        run: node scripts/ci/generate-summary.mjs

  launcher-windows:
    name: Windows launcher and seed safety
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Built-in Node modules only; no DB/Docker or secrets are used by these tests.
      - name: Verify CMD environment handoff and destructive seed guard
        run: node --test tests/unit/lab-launcher-env.test.mjs tests/unit/seed-safety.test.mjs

      - name: Parse load-test PowerShell entry points
        shell: pwsh
        run: |
          Get-ChildItem load-tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Check Windows load-test references
        run: node --test tests/unit/load-test-entrypoints.test.mjs

      - name: Parse public Windows PowerShell runner
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path load-tests/run-k6.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
