name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
      - fix/architecture-hardening
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: coderank_test_jwt_secret_must_be_at_least_32_characters_long_for_security
      WORKER_SERVICE_TOKEN: coderank_test_worker_service_token_must_be_at_least_32_characters_long
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup CI Environment
        run: cp .env.example .env

      - name: Run Unit & Regression Tests (Strict)
        run: npm test

  build:
    name: Monorepo Build Verification
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: coderank_test_jwt_secret_must_be_at_least_32_characters_long_for_security
      WORKER_SERVICE_TOKEN: coderank_test_worker_service_token_must_be_at_least_32_characters_long
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup CI Environment
        run: cp .env.example .env

      - name: Build Monorepo (Next.js Turbopack & Workspaces)
        run: npm run build

  docker-validate:
    name: Docker & Sandbox Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f runner/docker-compose.yml config
